[project]
name = "home-telescope"
version = "0.2.0"
description = "家庭智能望远镜：光学计算、今晚星空、自动寻星"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pi = ["gpiozero>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
telescope = "telescope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["telescope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
