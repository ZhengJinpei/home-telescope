[project]
name = "home-telescope"
version = "0.5.0"
description = "家用望远镜：观鸟镜设计、夜视望远镜、今晚星空、自制天文望远镜"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # 天文部分只用标准库；夜视部分要 numpy 和 pillow，见 nightscope 可选依赖

[project.optional-dependencies]
pi = ["gpiozero>=2.0"]
nightscope = ["numpy>=1.24", "pillow>=9"]
dev = ["pytest>=8", "numpy>=1.24", "pillow>=9"]

[project.scripts]
telescope = "telescope.cli:main"
nightscope = "nightscope.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["telescope", "nightscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
